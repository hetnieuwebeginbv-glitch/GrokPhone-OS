name: Build Manus Launcher

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'manus-launcher/**'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'manus-launcher/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Manus Launcher
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-launcher-${{ hashFiles('manus-launcher/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-launcher-

      - name: 🔑 Make gradlew executable
        run: chmod +x manus-launcher/gradlew

      - name: 🧪 Run unit tests
        working-directory: manus-launcher
        run: ./gradlew test

      - name: 🏗️ Build Debug APK
        working-directory: manus-launcher
        run: ./gradlew assembleDebug

      - name: 🏗️ Build Release APK
        working-directory: manus-launcher
        run: ./gradlew assembleRelease

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manus-launcher-debug-${{ github.sha }}
          path: manus-launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: manus-launcher-release-${{ github.sha }}
          path: manus-launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
