name: 🚀 Build Manus Launcher

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'manus-launcher/**'
      - '.github/workflows/build-launcher.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'manus-launcher/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Manus Launcher
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-launcher-${{ hashFiles('manus-launcher/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-launcher-

      - name: 🔧 Bootstrap Gradle Wrapper
        working-directory: manus-launcher
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version=8.9 --distribution-type=bin
          fi
          chmod +x gradlew

      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 🧹 Clean
        working-directory: manus-launcher
        run: ./gradlew clean --no-daemon

      - name: 🔍 Lint
        working-directory: manus-launcher
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: 🧪 Unit tests
        working-directory: manus-launcher
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: 🏗️ Build Debug APK
        working-directory: manus-launcher
        run: ./gradlew assembleDebug --no-daemon

      - name: 🏗️ Build Release APK
        working-directory: manus-launcher
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-${{ github.sha }}
          path: manus-launcher/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: launcher-release-${{ github.sha }}
          path: manus-launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: 📊 Upload build rapporten
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-reports-${{ github.sha }}
          path: manus-launcher/app/build/reports/
          retention-days: 14
