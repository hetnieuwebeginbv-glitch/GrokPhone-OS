name: Build Guardian App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'guardian-app/**'
      - '.github/workflows/build-guardian.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'guardian-app/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '35'

jobs:
  build:
    name: Build & Test Guardian App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-guardian-${{ hashFiles('guardian-app/**/*.gradle*', 'guardian-app/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-guardian-

      - name: 🔑 Make gradlew executable
        run: chmod +x guardian-app/gradlew

      - name: 🧹 Clean build
        working-directory: guardian-app
        run: ./gradlew clean

      - name: 🔍 Run lint checks
        working-directory: guardian-app
        run: ./gradlew lint

      - name: 🧪 Run unit tests
        working-directory: guardian-app
        run: ./gradlew test

      - name: 🏗️ Build Debug APK
        working-directory: guardian-app
        run: ./gradlew assembleDebug

      - name: 🏗️ Build Release APK
        working-directory: guardian-app
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-app-debug-${{ github.sha }}
          path: guardian-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-app-release-${{ github.sha }}
          path: guardian-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-test-results-${{ github.sha }}
          path: guardian-app/app/build/reports/tests/

      - name: 📊 Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-lint-results-${{ github.sha }}
          path: guardian-app/app/build/reports/lint-results-*.html
