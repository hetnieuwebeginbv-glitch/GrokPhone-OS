name: 🛡️ Build Guardian App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Guardian App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        working-directory: guardian-app
        run: chmod +x gradlew
      - name: Build Debug APK
        working-directory: guardian-app
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-debug-apk-${{ github.run_number }}
          path: guardian-app/app/build/outputs/apk/debug/
          retention-days: 30
