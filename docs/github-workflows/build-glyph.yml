name: Build Glyph Guardian

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'glyph-guardian/**'
      - '.github/workflows/build-glyph.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Glyph Guardian
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-glyph-${{ hashFiles('glyph-guardian/**/*.gradle*') }}

      - name: 🔑 Make gradlew executable
        run: chmod +x glyph-guardian/gradlew

      - name: 🏗️ Build Debug APK
        working-directory: glyph-guardian
        run: ./gradlew assembleDebug

      - name: 🏗️ Build Release APK
        working-directory: glyph-guardian
        run: ./gradlew assembleRelease

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glyph-guardian-release-${{ github.sha }}
          path: glyph-guardian/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
