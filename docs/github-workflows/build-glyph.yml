name: 💡 Build Glyph Guardian

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Glyph Guardian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Make gradlew executable
        working-directory: glyph-guardian
        run: chmod +x gradlew
      - name: Stub Glyph SDK for CI
        run: |
          mkdir -p glyph-guardian/libs
          echo '<?xml version="1.0" encoding="utf-8"?><manifest package="com.nothing.ketchum"/>' > /tmp/AndroidManifest.xml
          mkdir -p /tmp/res && cd /tmp && zip -r GlyphSDK.aar AndroidManifest.xml res/
          cp /tmp/GlyphSDK.aar glyph-guardian/libs/GlyphSDK.aar
      - name: Build Debug APK
        working-directory: glyph-guardian
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glyph-debug-apk-${{ github.run_number }}
          path: glyph-guardian/app/build/outputs/apk/debug/
          retention-days: 30
