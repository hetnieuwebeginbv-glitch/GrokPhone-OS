name: 🚀 Release — Build All & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-all:
    name: Build All APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ github.sha }}

      # ── Guardian App ──────────────────────────────────────────────
      - name: 🔑 Make Guardian gradlew executable
        run: chmod +x guardian-app/gradlew

      - name: 🏗️ Build Guardian App Release
        working-directory: guardian-app
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📋 Rename Guardian APK
        run: |
          cp guardian-app/app/build/outputs/apk/release/app-release.apk \
             guardian-app-release.apk

      # ── Manus Launcher ────────────────────────────────────────────
      - name: 🔑 Make Launcher gradlew executable
        run: chmod +x manus-launcher/gradlew

      - name: 🏗️ Build Manus Launcher Release
        working-directory: manus-launcher
        run: ./gradlew assembleRelease

      - name: 📋 Rename Launcher APK
        run: |
          cp manus-launcher/app/build/outputs/apk/release/app-release.apk \
             manus-launcher-release.apk

      # ── Glyph Guardian ────────────────────────────────────────────
      - name: 🔑 Make Glyph gradlew executable
        run: chmod +x glyph-guardian/gradlew

      - name: 🏗️ Build Glyph Guardian Release
        working-directory: glyph-guardian
        run: ./gradlew assembleRelease

      - name: 📋 Rename Glyph APK
        run: |
          cp glyph-guardian/app/build/outputs/apk/release/app-release.apk \
             glyph-guardian-release.apk

      # ── Package installatiescript ──────────────────────────────────
      - name: 📦 Create install package
        run: |
          mkdir -p release-package
          cp guardian-app-release.apk release-package/
          cp manus-launcher-release.apk release-package/
          cp glyph-guardian-release.apk release-package/
          cp scripts/install.sh release-package/
          cp docs/INSTALL.md release-package/
          zip -r M-Ai-Phone-${{ github.ref_name }}.zip release-package/

      # ── GitHub Release aanmaken ───────────────────────────────────
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Ai Manus Phone ${{ github.ref_name }}"
          body: |
            ## 📱 Ai Manus Phone — ${{ github.ref_name }}

            Transform je Nothing Phone 3a naar de ultieme **Ai Manus Phone** door Stay4Safe Ai.

            ### 📦 Downloads
            | Bestand | Beschrijving |
            |---|---|
            | `guardian-app-release.apk` | Stay4S Guardian AI app |
            | `manus-launcher-release.apk` | Ai Manus custom launcher |
            | `glyph-guardian-release.apk` | Glyph LED herprogrammering |
            | `M-Ai-Phone-${{ github.ref_name }}.zip` | Alles-in-één installatiepakket |

            ### ⚡ Snelle installatie
            ```bash
            # Download het ZIP-pakket, pak het uit en voer uit:
            ./install.sh
            ```

            ### 📋 Vereisten
            - Nothing Phone 3a met Nothing OS 4.0+
            - ADB geïnstalleerd
            - Developer Mode ingeschakeld

            Zie `INSTALL.md` voor de volledige installatiehandleiding.

            ---
            *Gebouwd door GitHub Actions — Stay4Safe Ai © 2026*
          files: |
            guardian-app-release.apk
            manus-launcher-release.apk
            glyph-guardian-release.apk
            M-Ai-Phone-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
