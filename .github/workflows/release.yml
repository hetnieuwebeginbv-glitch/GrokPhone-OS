name: 🚀 Release — Build All & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

env:
  JAVA_VERSION: '17'

jobs:
  build-all:
    name: Build All APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: '35.0.0'

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Bootstrap Gradle Wrappers (alle modules)
        run: |
          for module in guardian-app manus-launcher glyph-guardian; do
            echo "=== Bootstrap $module ==="
            cd $module
            if [ ! -f "gradlew" ]; then
              gradle wrapper --gradle-version=8.9 --distribution-type=bin
            fi
            chmod +x gradlew
            cd ..
          done

      - name: 📦 Stub Nothing Glyph SDK voor CI
        run: |
          mkdir -p glyph-guardian/libs
          if [ ! -f "glyph-guardian/libs/GlyphSDK.aar" ]; then
            mkdir -p /tmp/glyph-stub/res
            echo '<?xml version="1.0" encoding="utf-8"?><manifest package="com.nothing.ketchum"/>' > /tmp/glyph-stub/AndroidManifest.xml
            cd /tmp/glyph-stub && zip -r GlyphSDK.aar AndroidManifest.xml res/
            cp /tmp/glyph-stub/GlyphSDK.aar glyph-guardian/libs/GlyphSDK.aar
          fi

      # ── Guardian App ──────────────────────────────────────────────
      - name: 🛡️ Build Guardian App Release
        working-directory: guardian-app
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📋 Rename Guardian APK
        run: |
          cp guardian-app/app/build/outputs/apk/release/app-release.apk \
             guardian-app-release.apk

      # ── Manus Launcher ────────────────────────────────────────────
      - name: 🚀 Build Manus Launcher Release
        working-directory: manus-launcher
        run: ./gradlew assembleRelease --no-daemon

      - name: 📋 Rename Launcher APK
        run: |
          cp manus-launcher/app/build/outputs/apk/release/app-release.apk \
             manus-launcher-release.apk

      # ── Glyph Guardian ────────────────────────────────────────────
      - name: 💡 Build Glyph Guardian Release
        working-directory: glyph-guardian
        run: ./gradlew assembleRelease --no-daemon
        env:
          NOTHING_API_KEY: ${{ secrets.NOTHING_API_KEY || 'test' }}

      - name: 📋 Rename Glyph APK
        run: |
          cp glyph-guardian/app/build/outputs/apk/release/app-release.apk \
             glyph-guardian-release.apk

      # ── Package installatiescript ──────────────────────────────────
      - name: 📦 Maak installatiepakket
        run: |
          VERSION=${{ github.ref_name || github.event.inputs.version }}
          mkdir -p release-package
          cp guardian-app-release.apk release-package/
          cp manus-launcher-release.apk release-package/
          cp glyph-guardian-release.apk release-package/
          cp scripts/install.sh release-package/
          cp docs/INSTALL.md release-package/
          zip -r M-Ai-Phone-${VERSION}.zip release-package/
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      # ── GitHub Release aanmaken ───────────────────────────────────
      - name: 🎉 Maak GitHub Release aan
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: "📱 Ai Manus Phone ${{ github.ref_name || github.event.inputs.version }}"
          body: |
            ## 📱 Ai Manus Phone — ${{ github.ref_name || github.event.inputs.version }}

            Transformeer je **Nothing Phone 3a** naar de ultieme **Ai Manus Phone** door Stay4Safe Ai.

            ### 📦 Downloads
            | Bestand | Beschrijving |
            |---|---|
            | `guardian-app-release.apk` | Stay4S Guardian AI — 4-laags bescherming |
            | `manus-launcher-release.apk` | Ai Manus custom launcher |
            | `glyph-guardian-release.apk` | Glyph LED herprogrammering |
            | `M-Ai-Phone-*.zip` | Alles-in-één installatiepakket |

            ### ⚡ Snelle installatie
            ```bash
            chmod +x install.sh && ./install.sh
            ```

            ### 📋 Vereisten
            - Nothing Phone 3a met Nothing OS 4.0+
            - ADB geïnstalleerd op je computer
            - Developer Mode + USB Debugging ingeschakeld

            ---
            *Gebouwd door GitHub Actions — Stay4Safe Ai Telecom © 2026*
          files: |
            guardian-app-release.apk
            manus-launcher-release.apk
            glyph-guardian-release.apk
            M-Ai-Phone-${{ env.VERSION }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}