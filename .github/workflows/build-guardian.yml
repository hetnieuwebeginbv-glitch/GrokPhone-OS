name: 🛡️ Build Guardian App

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'guardian-app/**'
      - '.github/workflows/build-guardian.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'guardian-app/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build & Test Guardian App
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-guardian-${{ hashFiles('guardian-app/**/*.gradle*', 'guardian-app/**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-guardian-

      - name: 🔧 Bootstrap Gradle Wrapper
        working-directory: guardian-app
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew niet gevonden — bootstrapping via gradle wrapper task"
            gradle wrapper --gradle-version=8.9 --distribution-type=bin
          fi
          chmod +x gradlew

      - name: ✅ Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: 🧹 Clean
        working-directory: guardian-app
        run: ./gradlew clean --no-daemon

      - name: 🔍 Lint
        working-directory: guardian-app
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: 🧪 Unit tests
        working-directory: guardian-app
        run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: 🏗️ Build Debug APK
        working-directory: guardian-app
        run: ./gradlew assembleDebug --no-daemon

      - name: 🏗️ Build Release APK
        working-directory: guardian-app
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guardian-debug-${{ github.sha }}
          path: guardian-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: guardian-release-${{ github.sha }}
          path: guardian-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: 📊 Upload alle build rapporten
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-reports-${{ github.sha }}
          path: guardian-app/app/build/reports/
          retention-days: 14
