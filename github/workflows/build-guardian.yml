#!/usr/bin/env python3
"""Push GitHub Actions workflow files via GitHub API (gh CLI)"""
import subprocess
import base64
import json
import os

REPO = "hetnieuwebeginbv-glitch/M-Ai-Phone"
BASE = "/home/ubuntu/M-Ai-Phone"

workflows = {
    ".github/workflows/build-guardian.yml": f"{BASE}/docs/github-workflows/build-guardian.yml",
    ".github/workflows/build-launcher.yml": f"{BASE}/docs/github-workflows/build-launcher.yml",
    ".github/workflows/build-glyph.yml":    f"{BASE}/docs/github-workflows/build-glyph.yml",
    ".github/workflows/release.yml":        f"{BASE}/docs/github-workflows/release.yml",
}

for dest_path, src_path in workflows.items():
    with open(src_path, "rb") as f:
        content_b64 = base64.b64encode(f.read()).decode("utf-8")

    payload = {
        "message": f"ci: add GitHub Actions workflow {os.path.basename(dest_path)}",
        "content": content_b64
    }

    # Schrijf payload naar tijdelijk bestand
    tmp = "/tmp/workflow_payload.json"
    with open(tmp, "w") as f:
        json.dump(payload, f)

    result = subprocess.run(
        ["gh", "api",
         f"repos/{REPO}/contents/{dest_path}",
         "--method", "PUT",
         "--input", tmp],
        capture_output=True, text=True
    )

    if result.returncode == 0:
        print(f"✓ {dest_path}")
    else:
        err = result.stderr.strip()[:300]
        out = result.stdout.strip()[:300]
        print(f"✗ {dest_path}")
        print(f"  stderr: {err}")
        print(f"  stdout: {out}")
